[package]
name = "nws-desktop"
description = "Naval Wargame Simulator desktop app (Tauri 2 shell around sim-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nws_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
sim-aar = { workspace = true, features = ["specta"] }
sim-core = { workspace = true, features = ["specta"] }
sim-scenario = { workspace = true, features = ["specta"] }
sim-db.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = [] }
tauri-specta.workspace = true

[lints]
workspace = true
