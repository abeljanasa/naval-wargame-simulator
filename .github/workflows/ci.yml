name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  rust:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS re-enabled for Gate 3 (2026-11-11).
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Front-end dist placeholder (tauri::generate_context! needs it to exist)
        shell: bash
        run: mkdir -p apps/desktop/dist
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (unit, property, determinism, golden replays, save/load)
        run: cargo test --workspace --locked
      - name: Accredited extension point (synthetic data only)
        run: cargo test -p sim-db --features accredited --locked
      - name: Generated TypeScript bindings are up to date
        shell: bash
        run: git diff --exit-code -- apps/desktop/src/lib/bindings.ts

  # Platform database validation suite (master prompt §9, ADR-0004).
  database:
    name: Platform database validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p sim-db -- validate --strict
      - run: cargo run --locked -p sim-db -- build --out open-platforms.sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: open-platforms-db
          path: open-platforms.sqlite

  # Cross-OS determinism (ADR-0003 §5): every OS must produce identical final hashes.
  determinism:
    name: Determinism hashes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS re-enabled for Gate 3 (2026-11-11).
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Run shipped scenarios for several seeds
        shell: bash
        run: |
          cargo run --release --locked -p nws-batch -- run data/scenarios/*.json \
            --seeds 1,2,3,42,20261110 --out hashes.json
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes.json

  determinism-compare:
    name: Determinism matrix agrees
    needs: determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: hashes-*, path: hashes }
      - name: Compare hashes across OSes
        run: |
          set -euo pipefail
          first=""
          for f in hashes/*/hashes.json; do
            echo "== $f"; cat "$f"
            if [ -z "$first" ]; then first="$f"; continue; fi
            if ! diff <(jq -S . "$first") <(jq -S . "$f"); then
              echo "::error::Determinism failure: $f differs from $first"
              exit 1
            fi
          done
          echo "All OSes produced identical hashes."

  # Dependency licences (no GPL/AGPL/LGPL), sources and security advisories (deny.toml).
  dependencies:
    name: Dependency audit (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Performance budgets (master prompt §12). The budgets are defined for the reference laptop; the
  # CI gate checks the 1,000-unit budget, which has ~3x headroom on a developer machine, and records
  # the 10,000-unit figure for trend review. See docs/build/performance.md.
  performance:
    name: Performance budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p nws-batch
      - name: 1,000 units at >= 60x real time (gate)
        run: ./target/release/nws-batch bench --units 1000 --ticks 600 --min-ratio 60 | tee bench-1k.json
      - name: 10,000 units (recorded; reference-laptop budget is >= 1x)
        run: ./target/release/nws-batch bench --units 10000 --ticks 60 | tee bench-10k.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench-*.json

  # Criterion regression gate (master prompt §12): the PR's base and head are benchmarked on the
  # same runner, and the job fails if any benchmark is > 15 % slower (scripts/check_bench_regression.py).
  bench-regression:
    name: Benchmark regression (> 15 % fails)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark the base commit
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          if [ -f crates/sim-scenario/benches/engine.rs ]; then
            cargo bench -p sim-scenario --bench engine -- --save-baseline base
          else
            echo "base has no criterion benchmarks yet; comparison skipped"
          fi
          git checkout --quiet ${{ github.event.pull_request.head.sha }}
      - name: Benchmark the change against the base
        run: |
          if [ -d target/criterion ]; then
            cargo bench -p sim-scenario --bench engine -- --baseline base
          fi
          python3 scripts/check_bench_regression.py target/criterion --threshold 0.15

  # Air-gapped build path: every dependency vendored, then built with no network.
  offline-build:
    name: Air-gapped build (vendored, offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Vendor all crates
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
      - name: Build and test engine crates with the network disabled
        run: |
          cargo build --offline --locked -p sim-core -p sim-geo -p sim-sensors -p sim-c2 -p sim-weapons -p sim-ai -p sim-events -p sim-db -p sim-scenario -p nws-batch
          cargo test --offline --locked -p sim-core -p sim-geo -p sim-sensors -p sim-c2 -p sim-weapons -p sim-ai -p sim-events -p sim-db -p sim-scenario

  frontend:
    name: Front end (typecheck, lint, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: npm licence audit (production dependencies)
        run: npm run licenses
      - name: UI unit tests (Vitest)
        run: npm test
      - name: UI end-to-end smoke test (real UI, mocked backend)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  packaged-app:
    # The real binary, engine, database and map, driven over WebDriver (tauri-driver).
    # macOS has no WKWebView WebDriver, so Windows and Linux only.
    name: Packaged app end to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux system deps for Tauri, WebKitWebDriver and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - name: msedgedriver matching the runner's WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv
          Write-Output "WebView2 $v"
          $zip = Join-Path $env:RUNNER_TEMP "edgedriver.zip"
          $dir = Join-Path $env:RUNNER_TEMP "edgedriver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          "NATIVE_DRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Build the app (release, no installer)
        run: npx tauri build --no-bundle
      - name: Packaged-app test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e:app
      - name: Packaged-app test (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e:app
      - run: npm run build
