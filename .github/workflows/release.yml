name: Release

# Builds native installers for all three OSes, scans them for non-open data, and produces SBOMs.
# Signing happens only when the signing secrets are configured. Unsigned builds are marked as such.
# See docs/build/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the AppImage's glibc floor low enough for older target systems.
        # macOS re-enabled for Gate 3 (2026-11-11).
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux system deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: macOS signing and notarisation credentials (only if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            # Tauri reads these and signs + notarises the .app/.dmg during `tauri build`.
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v<<EOF" >> "$GITHUB_ENV"; printf '%s\n' "${!v}" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::APPLE_CERTIFICATE not configured: macOS build will be UNSIGNED"
          fi

      - name: Build installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - name: Sign Windows installers (only if configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE not configured: Windows installers are UNSIGNED"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $files = Get-ChildItem target\release\bundle -Recurse -Include *.msi,*.exe
          foreach ($f in $files) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $($f.FullName)" }
          }
          Remove-Item $pfx

      # Master prompt §3: no database outside the allowlist, nothing but UNCLASSIFIED, in release artefacts.
      - name: Release scan
        run: cargo run --release --locked -p sim-db -- scan target/release/bundle data

      # Shipped scenarios travel with the installers (only the Phase 1 demo is built in), and
      # every file gets a SHA-256 sum for the air-gapped installation check
      # (docs/gate3/pilot-kit/installation-check.md). Runs after signing, so sums match what ships.
      - name: Scenarios and SHA-256 sums
        shell: bash
        run: |
          mkdir -p release-extra/scenarios
          cp data/scenarios/*.json release-extra/scenarios/
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          {
            find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
              -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0
            find release-extra/scenarios -type f -name '*.json' -print0
          } | sort -z | xargs -0 $sum > "release-extra/SHA256SUMS-${{ matrix.os }}.txt"
          cat "release-extra/SHA256SUMS-${{ matrix.os }}.txt"

      - name: SBOMs (CycloneDX)
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --override-filename sbom-rust
          mkdir -p sbom
          find . -name 'sbom-rust.json' -not -path './target/*' -not -path '*/node_modules/*' \
            -exec sh -c 'cp "$1" "sbom/$(basename "$(dirname "$1")")-rust.cdx.json"' _ {} \;
          (cd apps/desktop && npm sbom --sbom-format cyclonedx --omit dev) > sbom/desktop-npm.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            release-extra/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: sbom/
