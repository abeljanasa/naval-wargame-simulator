name: Release

# Builds native installers for all three OSes, scans them for non-open data, and produces SBOMs.
# Signing happens only when the signing secrets are configured. Unsigned builds are marked as such.
# See docs/build/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gebco_dataset:
        description: "GEBCO dataset id on NOAA CoastWatch ERDDAP for the world terrain layer"
        default: GEBCO_2020
      gebco_credit:
        description: "The credit its licence asks for (shown with the map)"
        default: "GEBCO Compilation Group (2020) GEBCO 2020 Grid (doi:10.5285/a29c5465-b138-234d-e053-6c86abc040b9)"

env:
  CARGO_TERM_COLOR: always

jobs:
  # The world terrain layer (4 arc-minutes) is built from its online source for every release, so
  # each release carries the current GEBCO grid (docs/build/releasing.md). It is not kept in the
  # repository.
  terrain:
    name: World terrain layer (from GEBCO online)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build nws-batch
        run: cargo build --release --locked -p nws-batch
      - name: Download GEBCO and build the pack
        shell: bash
        env:
          GEBCO_DATASET: ${{ inputs.gebco_dataset || 'GEBCO_2020' }}
          GEBCO_CREDIT: ${{ inputs.gebco_credit || 'GEBCO Compilation Group (2020) GEBCO 2020 Grid (doi:10.5285/a29c5465-b138-234d-e053-6c86abc040b9)' }}
          NWS_BATCH: target/release/nws-batch.exe
        run: scripts/terrain/world-layer.sh terrain-pack
      - uses: actions/upload-artifact@v4
        with:
          name: terrain-world
          path: terrain-pack/
          if-no-files-found: error

  bundle:
    name: Installers (${{ matrix.os }})
    needs: terrain
    strategy:
      fail-fast: false
      matrix:
        # macOS re-enabled for Gate 3 (2026-11-11).
        # The application targets Windows and macOS only (ADR-0006).
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: macOS signing and notarisation credentials (only if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            # Tauri reads these and signs + notarises the .app/.dmg during `tauri build`.
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v<<EOF" >> "$GITHUB_ENV"; printf '%s\n' "${!v}" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::APPLE_CERTIFICATE not configured: macOS build is ad-hoc signed (tauri.conf.json), not notarised (ADR-0008)"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: terrain-world
          path: apps/desktop/src-tauri/terrain

      # tauri.terrain.json bundles src-tauri/terrain/ as the app's built-in terrain folder.
      - name: Build installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.terrain.json

      - name: Sign Windows installers (only if configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE not configured: Windows installers are UNSIGNED"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $files = Get-ChildItem target\release\bundle -Recurse -Include *.msi,*.exe
            foreach ($f in $files) {
              & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing failed: $($f.FullName)" }
            }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }
          # Every installer must now carry a signature. With the self-signed certificate (ADR-0008)
          # the runner does not trust its root, so the status is not "Valid"; the signer and the
          # timestamp are what matter here.
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -eq "NotSigned" -or -not $sig.SignerCertificate) { throw "not signed: $($f.Name)" }
            Write-Output "$($f.Name): signed by $($sig.SignerCertificate.Subject), timestamped: $([bool]$sig.TimeStamperCertificate), status $($sig.Status)"
          }

      # Master prompt §3: no database outside the allowlist, nothing but UNCLASSIFIED, in release artefacts.
      - name: Release scan
        run: cargo run --release --locked -p sim-db -- scan target/release/bundle data

      # Shipped scenarios travel with the installers (only the Phase 1 demo is built in), and
      # every file gets a SHA-256 sum for the air-gapped installation check
      # (docs/gate3/pilot-kit/installation-check.md). Runs after signing, so sums match what ships.
      - name: Scenarios and SHA-256 sums
        shell: bash
        run: |
          mkdir -p release-extra/scenarios release-extra/terrain
          cp data/scenarios/*.json release-extra/scenarios/
          # The world layer also ships on its own, to install or check separately.
          cp apps/desktop/src-tauri/terrain/* release-extra/terrain/
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          {
            find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -print0
            find release-extra/scenarios -type f -name '*.json' -print0
            find release-extra/terrain -type f -name '*.nwsterrain' -print0
          } | sort -z | xargs -0 $sum > "release-extra/SHA256SUMS-${{ matrix.os }}.txt"
          cat "release-extra/SHA256SUMS-${{ matrix.os }}.txt"

      - name: SBOMs (CycloneDX)
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json --override-filename sbom-rust
          mkdir -p sbom
          find . -name 'sbom-rust.json' -not -path './target/*' -not -path '*/node_modules/*' \
            -exec sh -c 'cp "$1" "sbom/$(basename "$(dirname "$1")")-rust.cdx.json"' _ {} \;
          (cd apps/desktop && npm sbom --sbom-format cyclonedx --omit dev) > sbom/desktop-npm.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            release-extra/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: sbom/
