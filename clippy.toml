# Determinism guards (ADR-0003). Code outside the simulation logic (e.g. the desktop
# app's real-time pacer) may `#[allow(...)]` these at the exact site, with a comment explaining why.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "wall clock is non-deterministic; use the sim clock (ADR-0003)" },
    { path = "std::time::SystemTime::now", reason = "wall clock is non-deterministic; use the sim clock (ADR-0003)" },
    { path = "f64::sin", reason = "platform libm differs across OSes; use libm::sin (ADR-0003)" },
    { path = "f64::cos", reason = "use libm::cos (ADR-0003)" },
    { path = "f64::tan", reason = "use libm::tan (ADR-0003)" },
    { path = "f64::asin", reason = "use libm::asin (ADR-0003)" },
    { path = "f64::acos", reason = "use libm::acos (ADR-0003)" },
    { path = "f64::atan", reason = "use libm::atan (ADR-0003)" },
    { path = "f64::atan2", reason = "use libm::atan2 (ADR-0003)" },
    { path = "f64::sin_cos", reason = "use libm::sin / libm::cos (ADR-0003)" },
    { path = "f64::exp", reason = "use libm::exp (ADR-0003)" },
    { path = "f64::ln", reason = "use libm::log (ADR-0003)" },
    { path = "f64::log10", reason = "use libm::log10 (ADR-0003)" },
    { path = "f64::powf", reason = "use libm::pow (ADR-0003)" },
    { path = "f64::hypot", reason = "use libm::hypot (ADR-0003)" },
    { path = "f64::mul_add", reason = "FMA rounding differs from mul+add; keep out of logic (ADR-0003)" },
]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap or a sorted Vec (ADR-0003)" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet (ADR-0003)" },
]
