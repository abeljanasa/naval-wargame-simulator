[package]
name = "sim-scenario"
description = "Scenario file format (JSON), validation and loading into a Simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Derives `specta::Type` on the scenario types, for the desktop scenario editor.
specta = ["dep:specta", "sim-core/specta"]

[dependencies]
sim-core.workspace = true
specta = { workspace = true, optional = true }
sim-db.workspace = true
sim-geo.workspace = true
serde.workspace = true
serde_json.workspace = true
rand_chacha.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
sim-geo.workspace = true

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
